# Builds the runtime and toolbox images and pushes them to GHCR.
# Sibling of jovi-mall's `release.yml`; read that one's header for the reasoning.
#
# ⚠ THIS DOES NOT GATE ON THE TESTS. `ci.yml` runs on the same push, in parallel. Broken
# TypeScript cannot produce an image; a failing test still can. Check CI is green before
# you move a deployment onto a new tag.

name: Release image

on:
  push:
    # ─── TWO BRANCHES, TWO MEANINGS ───────────────────────────────────────────
    #   main        the TEST line. Builds an image tagged `test` + `sha-xxxxxxx`.
    #               Nothing is deployed from it today (there is no test stack
    #               yet); the image is built anyway so that adding one later is a
    #               deploy rather than a build-and-hope.
    #   production  the LIVE line. Builds `production` + `latest` + `sha-xxxxxxx`.
    #
    # ⚠ `latest` MOVES ONLY ON `production`. That is the whole safety property of
    #   this file. If `latest` were tagged on every branch — as it was before —
    #   a push to `main` would silently become the image a `latest`-pinned VPS
    #   pulls on its next restart, and a test change would reach customers
    #   without anyone deploying anything.
    #
    # ⚠ A STALE BRANCH PIN IS THE FAILURE TO WATCH FOR. The workflow still runs,
    #   reports nothing, and the ABSENCE of a build reads as "nothing changed".
    #   This file carried `phase-6-unbuilt-scope` for exactly that reason.
    branches: [main, production]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: runtime
            image: wi-admin
          # `ensure:indexes` and the admin bootstrap live here. wi-admin has no `test:env`,
          # so its own `.env.example` is not asserted against what `src/` reads — the
          # toolbox is how you fix the consequences on a live deployment.
          - target: toolbox
            image: wi-admin-toolbox

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            # ⚠ `latest` and `production` ONLY from the production branch. See the
            #   trigger comment above — this is what stops a test push going live.
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/production' }}
            type=raw,value=production,enable=${{ github.ref == 'refs/heads/production' }}
            type=raw,value=test,enable=${{ github.ref == 'refs/heads/main' }}
            # Always. This is the immutable tag you pin in the Dokploy environment
            # and the one you roll back TO — `latest` gives you nothing to return to.
            type=sha,format=short
            type=ref,event=tag

      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Deployable tag
        run: |
          echo "Built from branch $GITHUB_REF_NAME. Pin this as ADMIN_TAG in the Dokploy environment:" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "ADMIN_TAG=sha-$(git rev-parse --short HEAD)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
